name: Build APK

on:
  push:
    branches: [ MaikoTS ]
  pull_request:
    branches: [ MaikoTS ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0

    - name: Garantir LFS pull completo
      run: |
        git lfs install
        git lfs pull

    - name: Verificar se as libs nativas estão presentes
      run: |
        echo "=== Tamanho das libs em jnilibs ==="
        ls -lh app/src/main/jnilibs/arm64-v8a/
        echo "=== Tipo dos arquivos ==="
        file app/src/main/jnilibs/arm64-v8a/libclang.so
        echo "=== Verificação de tamanho mínimo ==="
        SIZE=$(stat -c%s app/src/main/jnilibs/arm64-v8a/libclang.so)
        if [ "$SIZE" -lt 1000000 ]; then
          echo "ERRO: libclang.so tem apenas $SIZE bytes — LFS não baixou!"
          exit 1
        fi
        echo "OK: libclang.so tem $SIZE bytes"

    - name: Configurar JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Dar permissão ao gradlew
      run: chmod +x ./gradlew

    - name: Compilar APK de Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Verificar conteúdo do APK
      run: |
        unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a" || {
          echo "ERRO: Nenhuma lib em lib/arm64-v8a no APK!"
          exit 1
        }

    - name: Upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
